site_name: Hyperfine for Mere Mortals
site_description: A stopwatch for the command line that runs a command many times and reports honest statistics. Comparing two ways of doing the same job, sweeping a parameter across values, exporting the numbers, and learning when a benchmark is lying to you.
site_url: https://paulsullivan33-dev.github.io/hyperfine-for-mere-mortals/
